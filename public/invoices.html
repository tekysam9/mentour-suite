<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fin-Module — Mentour Suite</title>
<link rel="stylesheet" href="/shared.css">
<style>
  .fin-body { max-width: 1180px; margin: 0 auto; padding: 40px 24px 64px; }
  .fin-back { font-size: 12.5px; color: var(--pine); text-decoration: none; font-weight: 500; }
  .fin-back:hover { text-decoration: underline; }
  .fin-title { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; font-size: 30px; font-weight: 600; color: var(--ink); margin: 14px 0 6px; }
  .fin-copy { font-size: 13.5px; color: var(--text-muted); margin: 0 0 24px; max-width: 680px; line-height: 1.6; }

  .fin-generate-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 22px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px;
  }
  .fin-generate-card label { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--text-muted); }
  .fin-generate-card input, .fin-generate-card select {
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px;
    font-family: inherit; color: var(--text); background: var(--paper); outline: none;
  }
  .fin-generate-card input:focus, .fin-generate-card select:focus { border-color: var(--pine); }
  .fin-btn {
    border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 9px 14px;
    font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; color: var(--text);
  }
  .fin-btn:hover { background: var(--paper); }
  .fin-btn:disabled { opacity: 0.6; cursor: default; }
  .fin-btn-primary { background: var(--pine); border-color: var(--pine); color: #EFF3EC; }
  .fin-btn-primary:hover { background: #275F46; }
  .fin-btn-small { font-size: 11.5px; padding: 5px 9px; }
  .fin-btn-danger { color: var(--brick); border-color: #E3C3C3; }

  .fin-result {
    background: #EAF3EE; border: 1px solid #CFE3D7; color: #2E6F52; border-radius: 8px;
    padding: 10px 14px; font-size: 12.5px; margin-bottom: 18px; line-height: 1.6;
  }
  .fin-result-skip-list { margin: 6px 0 0; padding-left: 18px; color: #4D6B5C; }

  .fin-controls { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 12px; flex-wrap: wrap; }
  .fin-controls select, .fin-controls input {
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12.5px;
    font-family: inherit; color: var(--text); background: var(--card); outline: none;
  }

  .fin-table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; overflow-x: auto; }
  table.fin-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .fin-table th {
    text-align: left; font-size: 10.5px; font-weight: 600; color: var(--text-muted);
    padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--paper);
    white-space: nowrap; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .fin-table td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  .fin-table tr:last-child td { border-bottom: none; }
  .fin-muted { color: var(--text-muted); }
  .fin-invoice-no { font-weight: 600; color: var(--ink); font-size: 11.5px; }
  .fin-consultant { font-weight: 600; color: var(--ink); }
  .fin-num-input, .fin-notes-input, .fin-date-input, .fin-select-input {
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; font-size: 12.5px;
    font-family: inherit; color: var(--text); background: var(--paper); outline: none;
  }
  .fin-num-input { width: 90px; }
  .fin-notes-input { width: 140px; }
  .fin-date-input { width: 128px; }
  .fin-num-input:focus, .fin-notes-input:focus, .fin-date-input:focus, .fin-select-input:focus { border-color: var(--pine); }

  .fin-status-badge {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
    white-space: nowrap; border: none; cursor: pointer; font-family: inherit;
  }
  .fin-status-paid { background: #EAF3EE; color: #2E6F52; }
  .fin-status-unpaid { background: #F5F1E4; color: #97854A; }
  .fin-status-yes { background: #EAF3EE; color: #2E6F52; }
  .fin-status-no { background: #EFEFEC; color: #7A7A72; }

  .fin-loading, .fin-empty-state { padding: 40px; text-align: center; color: var(--text-muted); font-size: 13.5px; }
  .fin-generate-card label.fin-check, .fin-controls label.fin-check {
    flex-direction: row; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--text); cursor: pointer;
    display: flex; align-self: center;
  }
  .fin-check input { margin: 0; accent-color: var(--pine); }
  .fin-sno { color: var(--text-muted); font-size: 11.5px; text-align: right; }
  .fin-inactive-tag {
    display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 99px;
    background: #EFEFEC; color: #7A7A72; vertical-align: middle;
  }
  .fin-saved-tick { font-size: 11px; color: var(--pine); font-weight: 500; margin-left: 6px; }

  .fin-subtitle { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; font-size: 22px; font-weight: 600; color: var(--ink); margin: 0 0 6px; }
  .fin-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .fin-tab {
    background: none; border: none; font-family: inherit; font-size: 13.5px; font-weight: 600;
    color: var(--text-muted); padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .fin-tab.active { color: var(--ink); border-bottom-color: var(--pine); }
  .fin-tab:hover:not(.active) { color: var(--ink); }
  .fin-readonly-note {
    background: #F5F1E4; border: 1px solid #E6D9AE; color: #7A6421; border-radius: 8px;
    padding: 9px 14px; font-size: 12.5px; margin-bottom: 16px; line-height: 1.6;
  }
  .fin-badge-static { cursor: default; }
  .fin-src { font-size: 11px; color: var(--text-muted); }
  .fin-num { text-align: right; font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .fin-body button:focus-visible, .fin-body a:focus-visible, .fin-body select:focus-visible, .fin-body input:focus-visible, .fin-body summary:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }
  .hist-section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); margin: 18px 0 8px; }
  .hist-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .hist-chip, .hist-month {
    border: 1px solid var(--line); background: var(--card); border-radius: 8px; cursor: pointer; font-family: inherit; color: var(--ink);
    text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; font-size: 14px; font-weight: 600;
  }
  .hist-chip span, .hist-month span { font-size: 11px; font-weight: 500; color: var(--text-muted); }
  .hist-chip:hover, .hist-month:hover { border-color: var(--pine); }
  .hist-chip.on, .hist-month.on { background: var(--pine); border-color: var(--pine); color: #EFF3EC; }
  .hist-chip.on span, .hist-month.on span { color: #D5E3D8; }
  .hist-months { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .hist-month b { font-size: 14px; }
  .hist-month.empty:not(.on) { opacity: 0.55; }
  .hist-filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 20px 0 14px; }
  .hist-field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .hist-field input, .hist-field select { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 13px; font-family: inherit; color: var(--text); background: var(--card); }
  .hist-search { flex: 1 1 260px; }
  .hist-search input { width: 100%; box-sizing: border-box; }
  .hist-inline { flex-direction: row; align-items: center; gap: 6px; }
  .hist-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 6px 0 14px; }
  .hist-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .hist-card-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .hist-card-value { font-size: 20px; font-weight: 700; color: var(--ink); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .hist-card-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
  .hist-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .hist-actions a.fin-btn { text-decoration: none; display: inline-block; }
  .hist-sort { background: none; border: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; padding: 0; }
  .hist-sort:hover { color: var(--ink); text-decoration: underline; }
  .hist-tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .hist-tag-w2 { background: #E6EEF7; color: #2F5C8F; }
  .hist-tag-1099 { background: #F1E8F5; color: #6B3F86; }
  .hist-tag-sub { background: #FBEFD9; color: #8A5A12; }
  .hist-norate { color: var(--brick); font-size: 11.5px; font-weight: 600; }
  .hist-pager { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; font-size: 12.5px; color: var(--text-muted); }
  .hist-pager-btns { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .imp-details { margin: 10px 0; }
  .imp-details > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink); padding: 6px 0; }
  .imp-details .fin-table-wrap { max-height: 360px; overflow: auto; }
  @media (max-width: 640px) { .fin-body { padding: 24px 14px 48px; } .hist-months { grid-template-columns: repeat(3, 1fr); } }
  .fin-total-row td { font-weight: 600; background: var(--paper); border-top: 1px solid var(--line); }
  .fin-month-row td { background: #F3F1EA; font-weight: 600; color: var(--ink); font-size: 13px; padding-top: 9px; padding-bottom: 9px; }
  .fin-month-row .fin-src { font-weight: 500; margin-left: 8px; }
  .fin-subtotal-row td { font-weight: 600; font-size: 12.5px; border-bottom: 2px solid var(--line); }
  .fin-grand-row td { font-weight: 700; background: #EAF3EE; color: #2E6F52; border-top: 2px solid #2E6F52; }
  .fin-months { position: relative; }
  .fin-months-btn { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 12.5px; background: var(--paper); color: var(--text); cursor: pointer; min-width: 170px; text-align: left; }
  .fin-months-panel { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.08); padding: 8px; min-width: 230px; max-height: 340px; overflow-y: auto; }
  .fin-months-panel label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 12.5px; cursor: pointer; border-radius: 4px; }
  .fin-months-panel label:hover { background: var(--paper); }
  .fin-months-panel .fin-months-actions { display: flex; justify-content: space-between; gap: 8px; padding: 2px 6px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .fin-months-panel .fin-count { margin-left: auto; color: var(--text-muted); font-size: 11px; }
  .fin-fix { display: flex; flex-direction: column; gap: 6px; min-width: 300px; max-width: 420px; white-space: normal; }
  .fin-wrap-cell { white-space: normal !important; max-width: 260px; }
  .fin-fix-line select { max-width: 280px; }
  .fin-fix-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; }
  .fin-fix-line select, .fin-fix-line input { border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: inherit; font-size: 12.5px; background: var(--paper); }
  .fin-fix-line input { width: 80px; }
  .fin-fix-note { font-size: 11px; color: var(--text-muted); }
  .fin-ok-note { background: #EAF3EE; border: 1px solid #BFDCCB; color: #2E6F52; border-radius: 8px; padding: 9px 14px; font-size: 12.5px; margin-bottom: 12px; }
  .fin-linkbtn { background: none; border: none; padding: 0; color: var(--pine); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/import-hours.js"></script>
</head>
<body>
<div id="app"></div>
<script src="/fin-import.js"></script>
<script src="/fin-history.js"></script>
<script>
  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function currentYearMonth() {
    var now = new Date();
    return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  }

  function money(n) {
    if (n === null || n === undefined || n === '') return '';
    var num = Number(n);
    if (!Number.isFinite(num)) return '';
    return num.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  var appEl = document.getElementById('app');

  var state = {
    user: null,
    loading: true,
    invoices: [],
    selectedMonths: [],   // invoice months ('YYYY-MM') to show; empty = all months
    months: [],           // [{ month, count }] from GET /api/invoices/months
    monthsOpen: false,
    paymentFilter: 'all',
    timesheetFilter: 'all',
    showInactive: false,
    generateForm: { periodMonth: currentYearMonth(), netTerms: 'NET30', issueDate: new Date().toISOString().slice(0, 10), includeInactive: false },
    generating: false,
    generateResult: null,
    savedId: null,
    tab: 'client',
    imp: {
      fileName: null, parsed: null, year: String(new Date().getFullYear()),
      fix: {}, fixBusy: false, notice: null, aliases: [], aliasesLoaded: false,
      netTerms: 'NET30', paymentStatus: 'paid', timesheet: 'yes',
      busy: false, error: null, preview: null, result: null,
    },
    hx: {
      fileName: null, rows: [], sheets: [], skipped: [], warnings: [],
      netTerms: 'NET30', paymentStatus: 'unpaid', timesheet: 'yes', createSubvendors: false, enforceDates: true, arrears: true,
      busy: false, error: null, preview: null, result: null,
    },
    hist: {
      loaded: false, loading: false, error: null, data: null, flash: null,
      year: '', month: '', q: '', category: '', paymentStatus: '', hours: '', rate: '', clientId: '',
      sort: 'period', dir: 'desc', page: 1, pageSize: 50,
    },
    sv: {
      loading: false, loaded: false, invoices: [], subvendors: [], ledgerFile: null,
      periodFilter: '', subvendorFilter: '', kindFilter: 'all',
      generateForm: { periodMonth: '', netTerms: 'NET30', issueDate: '', includeInactive: false },
      generationStart: null, savedId: null,
      generating: false, generateResult: null,
    },
  };

  function clientProgramCell(inv) {
    if (inv.program_name) return escapeHtml(inv.client_name || '') + ' / ' + escapeHtml(inv.program_name);
    if (inv.client_name) return escapeHtml(inv.client_name);
    return '<span class="fin-muted">—</span>';
  }

  function inactiveTag(inv) {
    if (inv.consultant_status === 'active') return '';
    return '<span class="fin-inactive-tag">' + (inv.consultant_status === 'inactive' ? 'Inactive' : 'Status not set') + '</span>';
  }

  function invMonthKey(inv) {
    return inv.period_key || (inv.period_month ? String(inv.period_month).slice(0, 7) : '');
  }

  function renderRow(inv, idx) {
    var savedTick = state.savedId === inv.id ? '<span class="fin-saved-tick">Saved</span>' : '';
    return (
      '<tr data-invoice-id="' + inv.id + '">' +
        '<td class="fin-sno">' + (idx + 1) + '</td>' +
        '<td class="fin-invoice-no">' + escapeHtml(inv.invoice_number) + '</td>' +
        '<td class="fin-consultant">' + escapeHtml(inv.consultant_name) + inactiveTag(inv) + '</td>' +
        '<td>' + clientProgramCell(inv) + '</td>' +
        '<td>' + (invMonthKey(inv) ? escapeHtml(ImportHours.monthKeyLabel(invMonthKey(inv))) : '') + '</td>' +
        '<td class="fin-muted">' + (invMonthKey(inv) ? escapeHtml(ImportHours.monthKeyLabel(ImportHours.hoursMonthKey(invMonthKey(inv)))) : '') + '</td>' +
        '<td>' + (inv.rate !== null ? '$' + money(inv.rate) + '/hr' : '<span class="fin-muted">—</span>') + '</td>' +
        '<td><input class="fin-num-input" type="number" step="0.25" data-field="hours" value="' + (inv.hours !== null && inv.hours !== undefined ? inv.hours : '') + '" placeholder="—"></td>' +
        '<td><input class="fin-num-input" type="number" step="0.01" data-field="amount" value="' + (inv.amount !== null && inv.amount !== undefined ? inv.amount : '') + '" placeholder="—"></td>' +
        '<td>' +
          '<select class="fin-select-input" data-field="netTerms">' +
            ['NET15', 'NET30', 'NET45', 'NET60', 'NET90'].map(function (nt) {
              var sel = (inv.net_terms || 'NET30').toUpperCase() === nt ? ' selected' : '';
              return '<option value="' + nt + '"' + sel + '>' + nt + '</option>';
            }).join('') +
            (['NET15', 'NET30', 'NET45', 'NET60', 'NET90'].indexOf((inv.net_terms || '').toUpperCase()) === -1
              ? '<option value="' + escapeHtml(inv.net_terms) + '" selected>' + escapeHtml(inv.net_terms) + '</option>' : '') +
          '</select>' +
        '</td>' +
        '<td><input class="fin-date-input" type="date" data-field="dueDate" value="' + (inv.due_date ? String(inv.due_date).slice(0, 10) : '') + '"></td>' +
        '<td><button type="button" class="fin-status-badge fin-status-' + inv.payment_status + '" data-action="toggle-payment">' + (inv.payment_status === 'paid' ? 'Paid' : 'Unpaid') + '</button></td>' +
        '<td><button type="button" class="fin-status-badge fin-status-' + inv.timesheet_submitted + '" data-action="toggle-timesheet">' + (inv.timesheet_submitted === 'yes' ? 'Submitted' : 'Not yet') + '</button></td>' +
        '<td><input class="fin-notes-input" type="text" data-field="notes" value="' + escapeHtml(inv.notes || '') + '" placeholder="Notes"></td>' +
        '<td><button type="button" class="fin-btn fin-btn-small fin-btn-danger" data-action="delete-invoice">Delete</button>' + savedTick + '</td>' +
      '</tr>'
    );
  }

  function fmtHours(n) {
    return Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
  }

  // All shown invoices grouped by invoice month (newest first): a month header
  // row, the invoices (S.No. runs on across the whole list), a subtotal row per
  // month and a grand total at the bottom. Totals follow the active filters
  // because they are summed from exactly the rows shown.
  function renderTable() {
    if (state.loading) return '<div class="fin-loading">Loading…</div>';
    if (!state.invoices.length) {
      return '<div class="fin-empty-state">No invoices for ' + (state.selectedMonths.length ? 'the selected month(s)' : 'any month') +
        ' with these filters. Generate some above, import hours, or widen the filters.</div>';
    }
    var COLS = 15;
    var groups = [];
    var byKey = {};
    state.invoices.forEach(function (inv) {
      var k = invMonthKey(inv);
      if (!byKey[k]) { byKey[k] = { key: k, rows: [] }; groups.push(byKey[k]); }
      byKey[k].rows.push(inv);
    });
    groups.sort(function (a, b) { return b.key.localeCompare(a.key); });
    var sno = 0, gHours = 0, gAmount = 0;
    var sumCells = function (label, hours, amount, cls) {
      return '<tr class="' + cls + '"><td colspan="7" style="text-align:right">' + label + '</td>' +
        '<td class="fin-num">' + fmtHours(hours) + ' h</td><td class="fin-num">$' + money(amount) + '</td><td colspan="' + (COLS - 9) + '"></td></tr>';
    };
    var body = groups.map(function (g) {
      var h = 0, a = 0;
      var rows = g.rows.map(function (inv) {
        h += Number(inv.hours) || 0; a += Number(inv.amount) || 0;
        return renderRow(inv, sno++);
      }).join('');
      gHours += h; gAmount += a;
      return '<tr class="fin-month-row"><td colspan="' + COLS + '">' + escapeHtml(ImportHours.monthKeyLabel(g.key)) +
          '<span class="fin-src">Hours for ' + escapeHtml(ImportHours.monthKeyLabel(ImportHours.hoursMonthKey(g.key))) + ' · ' + g.rows.length + ' invoice' + (g.rows.length === 1 ? '' : 's') + '</span></td></tr>' +
        rows + sumCells('Subtotal ' + escapeHtml(ImportHours.monthKeyLabel(g.key)), h, a, 'fin-subtotal-row');
    }).join('');
    var grand = sumCells('Total — ' + state.invoices.length + ' invoice' + (state.invoices.length === 1 ? '' : 's') + ' across ' + groups.length + ' month' + (groups.length === 1 ? '' : 's'), gHours, gAmount, 'fin-grand-row');
    return (
      '<div class="fin-table-wrap"><table class="fin-table"><thead><tr>' +
        '<th>S.No.</th><th>Invoice #</th><th>Consultant</th><th>Client / Program</th><th>Invoice month</th><th title="Billed one month in arrears: the hours on this invoice are for the month before">Hours for</th><th>Rate</th>' +
        '<th>Hours</th><th>Amount</th><th>Net terms</th><th>Due date</th><th>Payment</th><th>Timesheet</th><th>Notes</th><th></th>' +
      '</tr></thead><tbody>' + body + '</tbody><tfoot>' + grand + '</tfoot></table></div>'
    );
  }

  function monthsButtonLabel() {
    var sel = state.selectedMonths;
    if (!sel.length) return 'All months';
    var sorted = sel.slice().sort().reverse();
    if (sorted.length <= 2) return sorted.map(ImportHours.monthKeyLabel).join(', ');
    return sorted.length + ' months selected';
  }

  function renderMonthsPicker() {
    var sel = state.selectedMonths;
    var known = {};

  function renderGenerateResult() {

  // ---- Subvendor payments tab (read-only) ----
  function monthLabel(ym) {
    if (!ym) return '';
    var names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return names[Number(String(ym).slice(5, 7)) - 1] + ' ' + String(ym).slice(0, 4);
  }

  function fmtDate(d) {
    if (!d) return '';
    var p = String(d).slice(0, 10).split('-');
    return p[1] + '/' + p[2] + '/' + p[0];
  }

  var NET_OPTIONS = ['NET15', 'NET30', 'NET45', 'NET60', 'NET90'];

  function svRow(inv, idx) {
    var src = inv.kind === 'paid'
      ? 'Payments file' + (inv.paid_in ? ' · paid in ' + inv.paid_in : '') + (inv.multi_month ? ' · multi-month' : '')
      : (inv.rate_source === 'margin' ? 'Generated · Margin cost rate' : inv.rate_source === 'hours_file' ? 'Imported · hours file' : 'Generated · Ledger rate');

      '<td class="fin-sno">' + (idx + 1) + '</td>' +
      '<td class="fin-invoice-no">' + escapeHtml(inv.invoice_number) + '</td>' +
      '<td class="fin-consultant">' + escapeHtml(inv.subvendor_name) + '</td>' +
      '<td>' + escapeHtml(inv.consultant_name) + '</td>' +
      '<td' + (inv.label ? ' title="' + escapeHtml(inv.label) + '"' : '') + '>' + escapeHtml(monthLabel(inv.period_month)) + '</td>' +
      '<td class="fin-num">' + (inv.rate !== null && inv.rate !== undefined ? '$' + money(inv.rate) + '/hr' : '<span class="fin-muted">—</span>') + '</td>';

    if (inv.kind === 'paid') {
      // Already paid on the Ledger file: read-only, no inputs.
      return (
        '<tr>' + head +
          '<td class="fin-num">' + (inv.hours !== null && inv.hours !== undefined ? money(inv.hours) : '<span class="fin-muted">—</span>') + '</td>' +
          '<td class="fin-num">' + (inv.amount !== null && inv.amount !== undefined ? '$' + money(inv.amount) : '<span class="fin-muted">—</span>') + '</td>' +
          '<td><span class="fin-muted">—</span></td><td><span class="fin-muted">—</span></td>' +
          '<td><span class="fin-status-badge fin-badge-static fin-status-paid">Paid' + (inv.paid_date ? ' ' + escapeHtml(fmtDate(inv.paid_date)) : '') + '</span></td>' +
          '<td><span class="fin-muted">—</span></td><td><span class="fin-muted">—</span></td>' +
          '<td class="fin-src">' + escapeHtml(src) + '</td><td></td>' +
        '</tr>'
      );
    }

    var savedTick = state.sv.savedId === inv.id ? '<span class="fin-saved-tick">Saved</span>' : '';
    var netKnown = NET_OPTIONS.indexOf((inv.net_terms || '').toUpperCase()) !== -1;
    return (
      '<tr data-sv-id="' + inv.id + '">' + head +
        '<td><input class="fin-num-input" type="number" step="0.25" data-svfield="hours" value="' + (inv.hours !== null && inv.hours !== undefined ? inv.hours : '') + '" placeholder="—"></td>' +
        '<td><input class="fin-num-input" type="number" step="0.01" data-svfield="amount" value="' + (inv.amount !== null && inv.amount !== undefined ? inv.amount : '') + '" placeholder="—"></td>' +
        '<td><select class="fin-select-input" data-svfield="netTerms">' +
          NET_OPTIONS.map(function (nt) {
            return '<option value="' + nt + '"' + ((inv.net_terms || 'NET30').toUpperCase() === nt ? ' selected' : '') + '>' + nt + '</option>';
          }).join('') +
          (netKnown ? '' : '<option value="' + escapeHtml(inv.net_terms) + '" selected>' + escapeHtml(inv.net_terms) + '</option>') +
        '</select></td>' +
        '<td><input class="fin-date-input" type="date" data-svfield="dueDate" value="' + (inv.due_date ? String(inv.due_date).slice(0, 10) : '') + '"></td>' +
        '<td><button type="button" class="fin-status-badge fin-status-' + inv.payment_status + '" data-action="sv-toggle-payment">' + (inv.payment_status === 'paid' ? 'Paid' : 'Unpaid') + '</button></td>' +
        '<td><button type="button" class="fin-status-badge fin-status-' + inv.timesheet_submitted + '" data-action="sv-toggle-timesheet">' + (inv.timesheet_submitted === 'yes' ? 'Submitted' : 'Not yet') + '</button></td>' +
        '<td><input class="fin-notes-input" type="text" data-svfield="notes" value="' + escapeHtml(inv.notes || '') + '" placeholder="Notes"></td>' +
        '<td class="fin-src">' + escapeHtml(src) + '</td>' +
        '<td><button type="button" class="fin-btn fin-btn-small fin-btn-danger" data-action="sv-delete">Delete</button>' + savedTick + '</td>' +
      '</tr>'
    );

  function svTable() {
    var sv = state.sv;
    if (sv.loading) return '<div class="fin-loading">Loading…</div>';
    if (!sv.invoices.length) {
      return '<div class="fin-empty-state">' + (sv.ledgerFile
        ? 'No subvendor payments match this filter.'
        : 'No Ledger file uploaded yet — upload your sub vendor payments workbook in Ledger and the paid months will appear here.') + '</div>';
    }
    var total = sv.invoices.reduce(function (t, i) { return t + (Number(i.amount) || 0); }, 0);
    return (
      '<div class="fin-table-wrap"><table class="fin-table"><thead><tr>' +
        '<th>S.No.</th><th>Invoice #</th><th>Subvendor</th><th>Consultant</th><th>Month</th><th>Rate</th>' +
        '<th>Hours</th><th>Amount</th><th>Net terms</th><th>Due date</th><th>Payment</th><th>Timesheet</th><th>Notes</th><th>Source</th><th></th>' +
      '</tr></thead><tbody>' +
      sv.invoices.map(svRow).join('') +
      '<tr class="fin-total-row"><td colspan="7">Total (' + sv.invoices.length + ')</td><td class="fin-num">$' + money(total) + '</td><td colspan="7"></td></tr>' +
      '</tbody></table></div>'
    );
  }

  function svGenerateResult() {
    var r = state.sv.generateResult;
    if (!r) return '';
    var skipped = r.skipped || [];
    var other = skipped.filter(function (s) { return !s.inactive; });
    var inactiveCount = r.skippedInactive || 0;
    var skipHtml = '';
    if (other.length || inactiveCount) {
      skipHtml = '<ul class="fin-result-skip-list">' +
        (inactiveCount ? '<li>' + inactiveCount + ' pairing' + (inactiveCount === 1 ? '' : 's') +
          ' for inactive (or status-not-set) consultants — tick “Include inactive consultants” to generate them</li>' : '') +
        other.slice(0, 8).map(function (s) { return '<li>' + escapeHtml(s.consultant) + ' — ' + escapeHtml(s.reason) + '</li>'; }).join('') +
        (other.length > 8 ? '<li>…and ' + (other.length - 8) + ' more.</li>' : '') + '</ul>';
    }
    return '<div class="fin-result">Generated <strong>' + r.created.length + '</strong> invoice' + (r.created.length === 1 ? '' : 's') +
      (skipped.length ? ', skipped ' + skipped.length + '.' : '.') +
      (r.created.length ? ' Each is ' + r.defaultHours + ' hrs (' + r.billableDays + ' working days × 8) at the rate on file.' : '') +
      skipHtml + '</div>';
  }

  function renderSubvendorTab() {
    var sv = state.sv, gf = sv.generateForm;
    var file = sv.ledgerFile
      ? 'Paid months come from <strong>' + escapeHtml(sv.ledgerFile.file_name) + '</strong> (uploaded ' + escapeHtml(fmtDate(sv.ledgerFile.imported_at)) + ').'
      : 'No Ledger file uploaded yet.';
    var unread = (sv.unreadable && sv.unreadable.length)
      ? '<div class="fin-readonly-note">' + sv.unreadable.length + ' payment row(s) have no month/year in the label and are not listed as invoices: ' +
        sv.unreadable.slice(0, 8).map(function (u) { return escapeHtml((u.subvendor || '') + (u.label ? '/' + u.label : '') + ' — ' + (u.consultant || '')); }).join('; ') +
        (sv.unreadable.length > 8 ? '; …' : '') + '</div>'
      : '';
    return (
      '<h2 class="fin-subtitle">Subvendor payments.</h2>' +
      '<p class="fin-copy">What each subvendor invoices Mentour for each consultant, month by month. Months already paid are read straight from your sub vendor payments file (the month is the hours month in the label plus the Year column; unpaid red rows are left out) and can’t be edited. For every month after a consultant’s last month on the file, generate invoices at each consultant’s rate on the Ledger file — or, if Ledger has none, the cost rate on the Gross Margin file — then enter the actual hours (amount recalculates) and track NET terms, payment and timesheet just like client invoices. ' + file + '</p>' +
      unread +
      '<div class="fin-readonly-note">Rows marked “Payments file” are read-only. Generated invoices are editable; once a generated month’s real payment appears on the Ledger file, it replaces the generated invoice.</div>' +
      '<div class="fin-generate-card">' +
        '<label>Month' + (sv.generationStart ? ' (' + escapeHtml(monthLabel(sv.generationStart)) + ' or later)' : '') + '<input type="month" id="svgen-period"' + (sv.generationStart ? ' min="' + escapeHtml(sv.generationStart) + '"' : '') + ' value="' + escapeHtml(gf.periodMonth) + '"></label>' +
        '<label>Net terms<select id="svgen-net-terms">' +
          ['NET15', 'NET30', 'NET45', 'NET60', 'NET90'].map(function (nt) {
            return '<option value="' + nt + '"' + (gf.netTerms === nt ? ' selected' : '') + '>' + nt + '</option>';
          }).join('') +
        '</select></label>' +
        '<label>Issue date<input type="date" id="svgen-issue-date" value="' + escapeHtml(gf.issueDate) + '"></label>' +
        '<label class="fin-check"><input type="checkbox" id="svgen-include-inactive"' + (gf.includeInactive ? ' checked' : '') + '>Include inactive consultants</label>' +
        '<button type="button" class="fin-btn fin-btn-primary" id="svgenerate-btn"' + (sv.generating ? ' disabled' : '') + '>' +
          (sv.generating ? 'Generating…' : 'Generate invoices') +
        '</button>' +
      '</div>' +
      svGenerateResult() +
      '<div class="fin-controls">' +
        '<input type="month" id="svfilter-period" value="' + escapeHtml(sv.periodFilter) + '">' +
        '<select id="svfilter-subvendor"><option value="">All subvendors</option>' +
          sv.subvendors.map(function (x) {
            return '<option value="' + x.id + '"' + (String(sv.subvendorFilter) === String(x.id) ? ' selected' : '') + '>' + escapeHtml(x.name) + '</option>';
          }).join('') +
        '</select>' +
        '<select id="svfilter-kind">' +
          '<option value="all"' + (sv.kindFilter === 'all' ? ' selected' : '') + '>All</option>' +
          '<option value="paid"' + (sv.kindFilter === 'paid' ? ' selected' : '') + '>From payments file (read-only)</option>' +
          '<option value="generated"' + (sv.kindFilter === 'generated' ? ' selected' : '') + '>Generated invoices</option>' +
        '</select>' +
      '</div>' +
      svTable()
    );

  /* ===== Import hours: past/periodic client invoices from an Excel hours sheet ===== */
  // Month + year per "Hours/<month>" column: see public/import-hours.js.
  var IMP_MONTH_NAMES = ImportHours.MONTH_NAMES;

  // Reads EVERY sheet of the workbook (Sam's W2 Payroll file has one sheet per
  // month) into { sheets, skippedSheets, rows } -- see ImportHours.parseHoursSheets.
  function parseHoursWorkbook(wb) {
    var parsed = ImportHours.parseHoursSheets(wb.SheetNames.map(function (n) {
      return { name: n, grid: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }) };
    }));
    return parsed.sheets.length ? parsed : null;
  }

  // Each column's hours month -> invoice month, and the rows combined per
  // consultant + client keyed by hours month (re-worked out whenever the Hours
  // year box changes). Future months and a month listed twice for the same
  // consultant/client are held back here (the server refuses future months too).
  function impResolved() {
    return state.imp.parsed ? ImportHours.resolveHoursImport(state.imp.parsed, state.imp.year) : null;
  }

  function impMoney(n) { return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  function impPostBody(apply) {
    var imp = state.imp;
    return JSON.stringify({
      rows: impResolved().rows, netTerms: imp.netTerms, paymentStatus: imp.paymentStatus,
      timesheetSubmitted: imp.timesheet, apply: apply,
    });
  }

  function impCall(apply) {
    var imp = state.imp;
    imp.busy = true; imp.error = null; render();
    return fetch('/api/invoices/import-hours', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: impPostBody(apply) })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (b) {
          if (!res.ok) throw new Error(b.error || 'The import failed.');
          return b;
        });
      })
      .then(function (b) {
        imp.busy = false;
        if (apply) { imp.result = b; imp.preview = null; state.invoices = []; loadMonths(); loadInvoices(); }
        else { imp.preview = b; imp.result = null; }
        render();
      })
      .catch(function (err) { imp.busy = false; imp.error = err.message; render(); });
  }

  function impTable(title, headers, rows) {
    if (!rows.length) return '';
    return '<h3 class="fin-subtitle" style="font-size:15px;margin:18px 0 6px">' + title + ' (' + rows.length + ')</h3>' +
      '<div class="fin-table-wrap"><table class="fin-table"><thead><tr>' + headers.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }

  // "Dec 2025 – Aug 2026 (9 months, 1,416 h)" for one payload row.
  function impRowHoursSummary(resolved, row) {
    var r = resolved && resolved.rows[row - 1];
    if (!r) return '';
    var keys = Object.keys(r.hours).sort();
    if (!keys.length) return '';
    var total = keys.reduce(function (t, k) { return t + r.hours[k]; }, 0);
    var span = keys.length === 1 ? ImportHours.monthKeyLabel(keys[0]) : ImportHours.monthKeyLabel(keys[0]) + ' – ' + ImportHours.monthKeyLabel(keys[keys.length - 1]);
    return span + ' (' + keys.length + ' month' + (keys.length === 1 ? '' : 's') + ', ' + fmtHours(total) + ' h)';
  }

  function impPairingLabel(pr) {
    return (pr.client || '—') + (pr.program ? ' / ' + pr.program : '') + (pr.billing !== null && pr.billing !== undefined ? ' ($' + money(pr.billing) + '/hr)' : ' (no rate)') + (pr.status === 'left' ? ' — left' : '');
  }

  // Merge into one of the consultant's pairings, or add the text as a new pairing.
  function impFixCell(u, resolved) {
    var imp = state.imp;
    var f = imp.fix[u.row] || {};
    var dis = imp.fixBusy ? ' disabled' : '';
    var merge = u.pairings.length
      ? '<div class="fin-fix-line">Same as <select data-fix-merge="' + u.row + '">' + u.pairings.map(function (pr) {
          return '<option value="' + pr.assignmentId + '">' + escapeHtml(impPairingLabel(pr)) + '</option>';
        }).join('') + '</select><button type="button" class="fin-btn fin-btn-small fin-btn-primary" data-action="imp-merge" data-row="' + u.row + '"' + dis + '>Merge</button></div>' +
        '<div class="fin-fix-note">Saves “' + escapeHtml(u.client) + '” as another name for that client/program, so this and future imports match it.</div>'
      : '<div class="fin-fix-note">' + escapeHtml(u.consultantName) + ' has no pairings in Directory yet.</div>';
    var newLabel = 'Client <strong>' + escapeHtml(u.parsedClient || '—') + '</strong>' + (u.parsedProgram ? ', Program <strong>' + escapeHtml(u.parsedProgram) + '</strong>' : ' (no program)');
    var billPrefill = f.billing !== undefined ? f.billing : (resolved && resolved.rowBillRates[u.row - 1] !== null && resolved.rowBillRates[u.row - 1] !== undefined ? resolved.rowBillRates[u.row - 1] : '');
    var add = f.addOpen
      ? '<div class="fin-fix-line">New pairing: ' + newLabel + '</div>' +
        '<div class="fin-fix-line">Billing $/hr <input type="number" step="0.01" min="0" data-fix-billing="' + u.row + '" value="' + escapeHtml(billPrefill) + '">' +
          '<button type="button" class="fin-btn fin-btn-small fin-btn-primary" data-action="imp-add" data-row="' + u.row + '"' + dis + '>Add pairing</button>' +
          '<button type="button" class="fin-linkbtn" data-action="imp-add-cancel" data-row="' + u.row + '">Cancel</button></div>'
      : '<div class="fin-fix-line">or <button type="button" class="fin-linkbtn" data-action="imp-add-open" data-row="' + u.row + '">Add as a new pairing (' + newLabel.replace(/<[^>]+>/g, '') + ')</button></div>';
    return '<div class="fin-fix">' + merge + add + '</div>';
  }

  function impAliasesSection() {
    var list = state.imp.aliases || [];
    if (!list.length) return '';
    return impTable('Saved client name matches', ['Client column text', 'Matches', ''], list.map(function (a) {
      return '<tr><td>' + escapeHtml(a.alias_text) + '</td><td>' + escapeHtml(a.client_name + (a.program_name ? ' / ' + a.program_name : '')) + '</td>' +
        '<td><button type="button" class="fin-btn fin-btn-small fin-btn-danger" data-action="imp-alias-remove" data-alias-id="' + a.id + '">Remove</button></td></tr>';
    }));
  }

  function impLoadAliases() {
    return fetch('/api/directory/client-aliases').then(function (res) { return res.ok ? res.json() : { aliases: [] }; })
      .catch(function () { return { aliases: [] }; })
      .then(function (b) {
        var next = b.aliases || [];
        var changed = JSON.stringify(next) !== JSON.stringify(state.imp.aliases || []);
        state.imp.aliases = next; state.imp.aliasesLoaded = true;
        // Re-render only when something changed, so an open file picker isn't reset.
        if (changed) render();
      });
  }

  function impPost(url, body, method) {
    return fetch(url, { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (b) {
          if (!res.ok) throw new Error(b.error || 'That didn’t work. Please try again.');
          return b;
        });
      });
  }

  // After a merge/add: refresh the saved matches and re-run the preview, so the
  // row moves into "Will be created" (nothing is created until Apply).
  function impAfterFix(notice) {
    var imp = state.imp;
    imp.fixBusy = false; imp.notice = notice; imp.error = null;
    impLoadAliases();
    impCall(false);
  }

  function impFindUnmatched(row) {
    var p = state.imp.preview;
    return p ? p.unmatched.filter(function (u) { return u.fixable && u.row === row; })[0] : null;
  }

  function renderImportTab() {
    var imp = state.imp;
    if (!imp.aliasesLoaded) { imp.aliasesLoaded = true; setTimeout(impLoadAliases, 0); }
    var resolved = impResolved();
    var colsHtml = resolved ? '<ul class="fin-copy" style="margin:4px 0 8px 18px">' + resolved.columns.map(function (c) {
      return '<li>' + escapeHtml(c.sheet) + ': “' + escapeHtml(c.heading) + '” → hours for <strong>' + escapeHtml(c.label) + '</strong> → <strong>' + escapeHtml(c.invoiceLabel) + '</strong> invoice' +
        (c.source === 'sheet' ? ' (year from the sheet name)' : (c.source === 'order' ? ' (year from column order / Hours year box)' : '')) +
        (c.future ? ' — future, skipped' : '') + '</li>';
    }).join('') + '</ul>' : '';
    var rowLabel = function (u) {
      var src = resolved && resolved.rowSources[u.row - 1];
      return src ? escapeHtml(src.length > 60 ? src.slice(0, 57) + '…' : src) : String(u.row);
    };
    var p = imp.preview || imp.result;
    var out = '';
    if (p) {
      var sm = p.summary;
      var impSkipped = resolved ? resolved.skipped : [];
      out += '<div class="fin-readonly-note">' + (imp.result
        ? '<strong>Done — ' + imp.result.created + ' invoice(s) created, ' + (imp.result.filled || 0) + ' filled in.</strong> '
        : 'Preview only — nothing has been created yet. ') +
        sm.willCreate + ' to create, ' + sm.willFill + ' existing 0-hour invoice(s) to fill in (' + impMoney(sm.totalAmount) + ' total), ' + sm.skippedExisting + ' already have hours (left untouched), ' + (sm.unmatched + impSkipped.length) + ' not matched or skipped.</div>';
      if (imp.preview && (sm.willCreate || sm.willFill)) {
        out += '<div class="fin-controls" style="justify-content:flex-start"><button type="button" class="fin-btn fin-btn-primary" data-action="imp-apply"' + (imp.busy ? ' disabled' : '') + '>Apply: create ' + sm.willCreate + ', fill in ' + sm.willFill + '</button></div>';
      }
      if (imp.preview) {
        out += impTable('Will be created', ['Consultant', 'Client / Program', 'Invoice month', 'Hours for', 'Hours', 'Rate', 'Amount'], p.willCreate.map(function (w) {
          return '<tr><td>' + escapeHtml(w.consultant) + '</td><td>' + escapeHtml(w.program ? w.client + ' / ' + w.program : w.client) + '</td><td>' + escapeHtml(monthLabel(w.periodMonth + '-01')) + '</td><td>' + escapeHtml(ImportHours.monthKeyLabel(w.hoursMonth || ImportHours.hoursMonthKey(w.periodMonth))) +
            '</td><td class="fin-num">' + w.hours + '</td><td class="fin-num">' + impMoney(w.rate) + '</td><td class="fin-num">' + impMoney(w.amount) + '</td></tr>';
        }));
      }
      if (imp.preview) {
        out += impTable('Existing invoices at 0 hours — will be filled in', ['Consultant', 'Client / Program', 'Invoice month', 'Hours for', 'Hours', 'Rate', 'Amount'], p.willFill.map(function (w) {
          return '<tr><td>' + escapeHtml(w.consultant) + '</td><td>' + escapeHtml(w.program ? w.client + ' / ' + w.program : w.client) + '</td><td>' + escapeHtml(monthLabel(w.periodMonth + '-01')) + '</td><td>' + escapeHtml(ImportHours.monthKeyLabel(w.hoursMonth || ImportHours.hoursMonthKey(w.periodMonth))) +
            '</td><td class="fin-num">' + w.hours + '</td><td class="fin-num">' + impMoney(w.rate) + '</td><td class="fin-num">' + impMoney(w.amount) + '</td></tr>';
        }));
      }
      out += impTable('Already have hours — left as is', ['Consultant', 'Client / Program', 'Invoice month', 'Hours for', 'File hours', 'Invoice hours'], p.skippedExisting.map(function (w) {
        return '<tr><td>' + escapeHtml(w.consultant) + '</td><td>' + escapeHtml(w.program ? w.client + ' / ' + w.program : w.client) + '</td><td>' + escapeHtml(monthLabel(w.periodMonth + '-01')) + '</td><td>' + escapeHtml(ImportHours.monthKeyLabel(w.hoursMonth || ImportHours.hoursMonthKey(w.periodMonth))) +
          '</td><td class="fin-num">' + w.hours + '</td><td class="fin-num">' + (w.existingHours === null ? '—' : w.existingHours) + '</td></tr>';
      }));
      var fixable = p.unmatched.filter(function (u) { return u.fixable; });
      var otherUnmatched = p.unmatched.filter(function (u) { return !u.fixable; });
      if (fixable.length) {
        out += impTable('Client / program not recognised — merge or add to include these hours', ['Sheet / row', 'Consultant', 'Client column', 'Hours in file', imp.preview ? 'Fix' : ''], fixable.map(function (u) {
          return '<tr><td class="fin-wrap-cell">' + rowLabel(u) + '</td><td>' + escapeHtml(u.name) + '</td><td class="fin-wrap-cell"><strong>' + escapeHtml(u.client) + '</strong><div class="fin-fix-note">' + escapeHtml(u.reason) + '</div></td>' +
            '<td class="fin-wrap-cell">' + escapeHtml(impRowHoursSummary(resolved, u.row)) + '</td><td>' + (imp.preview ? impFixCell(u, resolved) : '') + '</td></tr>';
        }));
      }
      out += impTable('Not matched or skipped — not invoiced', ['Sheet / row', 'Consultant', 'Client column', 'Invoice month', 'Hours for', 'Why'], otherUnmatched.concat(impSkipped).map(function (u) {
        return '<tr><td>' + rowLabel(u) + '</td><td>' + escapeHtml(u.name) + '</td><td>' + escapeHtml(u.client) + '</td><td>' + (u.invoiceMonth ? escapeHtml(ImportHours.monthKeyLabel(u.invoiceMonth)) : '') + '</td><td>' + (u.hoursMonth ? escapeHtml(ImportHours.monthKeyLabel(u.hoursMonth)) : (u.month ? IMP_MONTH_NAMES[u.month - 1] : '')) + '</td><td>' + escapeHtml(u.reason) + '</td></tr>';
      }));
    }
    return (
      '<h2 class="fin-subtitle">Import hours.</h2>' +
      '<p class="fin-copy">Upload an Excel sheet with a <strong>Name</strong> column, a <strong>Client</strong> column (“Program/Client” or just the client) and one or more <strong>Hours/&lt;month&gt;</strong> columns (e.g. Hours/Jan, or Hours/December 2025). Every sheet is read, so a workbook with one sheet per month works. Billing is one month in arrears: each month’s hours go on the <strong>next</strong> month’s invoice (Dec 2025 hours → Jan 2026 invoice, dated Jan 1) at the billing rate already on file for the matching client/program. You’ll see a preview first; a month whose invoice already has hours is never changed (an invoice still at 0 hours is filled in). Upload a new file any time to add more months.</p>' +
      '<div class="fin-generate-card">' +
        '<label>Hours file<input type="file" id="imp-file" accept=".xlsx,.xls"></label>' +
        '<label>Hours year<input type="number" id="imp-year" min="2000" max="2100" value="' + escapeHtml(imp.year) + '" style="width:90px"></label>' +
        '<label>Net terms<select id="imp-net">' + ['NET15', 'NET30', 'NET45', 'NET60', 'NET90'].map(function (nt) {
          return '<option value="' + nt + '"' + (imp.netTerms === nt ? ' selected' : '') + '>' + nt + '</option>';
        }).join('') + '</select></label>' +
        '<label>Create as<select id="imp-pay"><option value="paid"' + (imp.paymentStatus === 'paid' ? ' selected' : '') + '>Paid</option><option value="unpaid"' + (imp.paymentStatus === 'unpaid' ? ' selected' : '') + '>Unpaid</option></select></label>' +
        '<label>Timesheet<select id="imp-ts"><option value="yes"' + (imp.timesheet === 'yes' ? ' selected' : '') + '>Submitted</option><option value="no"' + (imp.timesheet === 'no' ? ' selected' : '') + '>Not yet</option></select></label>' +
      '</div>' +
      (imp.fileName && resolved ? '<p class="fin-copy" style="margin-bottom:2px"><strong>' + escapeHtml(imp.fileName) + '</strong> — ' + imp.parsed.sheets.length + ' sheet(s) read, ' + resolved.rows.length + ' consultant/client row(s).' +
        (imp.parsed.skippedSheets.length ? ' Sheets with no Name / Client / Hours columns (not read): ' + escapeHtml(imp.parsed.skippedSheets.join(', ')) + '.' : '') +
        '<br><strong>Columns found:</strong></p>' + colsHtml +
        '<p class="fin-copy">' + (resolved.allYearsKnown
          ? 'Years read from the column headings / sheet names.'
          : 'Some headings have no year: there, columns after a Dec → Jan rollover use the Hours year box and columns before it are the year before. Change the Hours year box if these look wrong.') +
        ' Hours for a month after the current month are never invoiced.</p>' : '') +
      (imp.busy ? '<p class="fin-copy">Working…</p>' : '') +
      (imp.error ? '<div class="fin-readonly-note" role="alert" style="background:#F6E7E7;border-color:#E3BDBD;color:#8A2D2D">' + escapeHtml(imp.error) + '</div>' : '') +
      (imp.notice ? '<div class="fin-ok-note" role="status">' + escapeHtml(imp.notice) + '</div>' : '') +
      out +
      impAliasesSection()
    );
  }

  function render() {
    appEl.innerHTML =
      '<div class="landing-header">' +
        '<div><div class="landing-wordmark">Mentour Suite</div><div class="landing-sub">' + escapeHtml(state.user.organization.name) + '</div></div>' +
        '<div class="landing-account">Signed in as ' + escapeHtml(state.user.name) + '<br>' +
          '<button class="landing-btn" id="logout-btn" type="button">Log out</button>' +
        '</div>' +
      '</div>' +
      '<div class="fin-body">' +
        '<a class="fin-back" href="/">← Back to dashboards</a>' +
        '<h1 class="fin-title">Fin-Module.</h1>' +
        '<div class="fin-tabs">' +
          '<button type="button" class="fin-tab' + (state.tab === 'client' ? ' active' : '') + '" data-tab="client">Client invoices</button>' +
          '<button type="button" class="fin-tab' + (state.tab === 'subvendor' ? ' active' : '') + '" data-tab="subvendor">Subvendor payments</button>' +
          '<button type="button" class="fin-tab' + (state.tab === 'history' ? ' active' : '') + '" data-tab="history">Year &amp; month view</button>' +
          '<button type="button" class="fin-tab' + (state.tab === 'import' ? ' active' : '') + '" data-tab="import">Import hours</button>' +
          '<button type="button" class="fin-tab' + (state.tab === 'hximport' ? ' active' : '') + '" data-tab="hximport">Import history</button>' +
        '</div>' +
        (state.tab === 'subvendor' ? renderSubvendorTab() : state.tab === 'import' ? renderImportTab() : state.tab === 'hximport' ? renderHxTab() : state.tab === 'history' ? renderHistoryTab() : renderClientTab()) +
      '</div>';

    document.getElementById('logout-btn').addEventListener('click', async function () {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });
  }

  function loadSubvendor() {
    var sv = state.sv;
    sv.loading = true;
    render();
    var params = new URLSearchParams();
    if (sv.periodFilter) params.set('periodMonth', sv.periodFilter);
    if (sv.subvendorFilter) params.set('subvendorId', sv.subvendorFilter);
    if (sv.kindFilter !== 'all') params.set('kind', sv.kindFilter);
    fetch('/api/subvendor-invoices?' + params.toString()).then(function (res) {
      if (!res.ok) throw new Error('load failed');
      return res.json();
    }).then(function (body) {
      sv.invoices = body.invoices || [];
      // Keep the full subvendor list when a subvendor filter narrows the rows.
      if (!sv.subvendorFilter || !sv.subvendors.length) sv.subvendors = body.subvendors || [];
      sv.ledgerFile = body.ledgerFile;
      sv.generationStart = body.generationStart;
      sv.unreadable = body.unreadable || [];
      if (!sv.generateForm.periodMonth && body.generationStart) sv.generateForm.periodMonth = body.generationStart;
      sv.loaded = true;
      sv.loading = false;
      render();
    }).catch(function () {
      sv.invoices = [];
      sv.loading = false;
      render();
    });
  }

  // Invoice months with counts for the month selector (same visibility as the list).
  function loadMonths() {
    return fetch('/api/invoices/months' + (state.showInactive ? '?includeInactive=1' : ''))
      .then(function (res) { return res.ok ? res.json() : { months: [] }; })
      .catch(function () { return { months: [] }; })
      .then(function (b) { state.months = b.months || []; render(); });
  }

  function loadInvoices() {
    state.loading = true;
    render();
    var params = new URLSearchParams();
    if (state.selectedMonths.length) params.set('months', state.selectedMonths.slice().sort().join(','));
    if (state.paymentFilter !== 'all') params.set('paymentStatus', state.paymentFilter);
    if (state.timesheetFilter !== 'all') params.set('timesheetSubmitted', state.timesheetFilter);
    if (state.showInactive) params.set('includeInactive', '1');
    fetch('/api/invoices?' + params.toString()).then(function (res) {
      if (!res.ok) throw new Error('load failed');
      return res.json();
    }).then(function (body) {
      state.invoices = body.invoices || [];
      state.loading = false;
      render();
    }).catch(function () {
      state.invoices = [];
      state.loading = false;
      render();
    });
  }

  function patchInvoice(id, patch) {
    return fetch('/api/invoices/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch),
    }).then(function (res) {
      if (!res.ok) throw new Error('save failed');
      return res.json();
    }).then(function (body) {
      var idx = state.invoices.findIndex(function (i) { return i.id === id; });
      if (idx !== -1) state.invoices[idx] = Object.assign({}, state.invoices[idx], body.invoice);
      state.savedId = id;
      render();
      setTimeout(function () {
        if (state.savedId === id) { state.savedId = null; render(); }
      }, 1500);
    }).catch(function () {
      alert('Could not save that change. Please try again.');
    });
  }

  function patchSv(id, patch) {
    return fetch('/api/subvendor-invoices/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch),
    }).then(function (res) {
      if (!res.ok) throw new Error('save failed');
      return res.json();
    }).then(function (body) {
      var sv = state.sv;
      var idx = sv.invoices.findIndex(function (i) { return i.kind === 'generated' && i.id === id; });
      if (idx !== -1) {
        var inv = body.invoice;
        sv.invoices[idx] = Object.assign({}, sv.invoices[idx], {
          hours: inv.hours === null ? null : Number(inv.hours), amount: inv.amount === null ? null : Number(inv.amount),
          net_terms: inv.net_terms, due_date: String(inv.due_date).slice(0, 10), issue_date: String(inv.issue_date).slice(0, 10),
          payment_status: inv.payment_status, status: inv.payment_status,
          timesheet_submitted: inv.timesheet_submitted, notes: inv.notes,
        });
      }
      sv.savedId = id;
      render();
      setTimeout(function () { if (sv.savedId === id) { sv.savedId = null; render(); } }, 1500);
    }).catch(function () {
      alert('Could not save that change. Please try again.');
    });
  }

  appEl.addEventListener('click', function (e) {
    if (e.target.closest('[data-action="months-toggle"]')) { state.monthsOpen = !state.monthsOpen; render(); return; }
    if (e.target.closest('[data-action="months-all"], [data-action="months-clear"]')) {
      // Both show every month again: an empty selection means "All months".
      state.selectedMonths = [];
      if (e.target.closest('[data-action="months-all"]')) state.monthsOpen = false;
      loadInvoices();
      return;
    }
    if (state.monthsOpen && !e.target.closest('.fin-months')) { state.monthsOpen = false; render(); }
    if (e.target.closest('[data-action="imp-apply"]')) {
      if (state.imp.busy) return;
      state.imp.notice = null;
      impCall(true);
      return;
    }
    var impFixBtn = e.target.closest('[data-action="imp-merge"], [data-action="imp-add"], [data-action="imp-add-open"], [data-action="imp-add-cancel"], [data-action="imp-alias-remove"]');
    if (impFixBtn) {
      var im2 = state.imp;
      var fixAct = impFixBtn.getAttribute('data-action');
      if (fixAct === 'imp-alias-remove') {
        if (!confirm('Remove this saved match? Future imports of that text won’t match it any more (existing invoices stay).')) return;
        impPost('/api/directory/client-aliases/' + impFixBtn.getAttribute('data-alias-id'), null, 'DELETE')
          .then(function () { impAfterFix('Saved match removed.'); })
          .catch(function (err) { im2.error = err.message; render(); });
        return;
      }
      var fixRow = Number(impFixBtn.getAttribute('data-row'));
      var u = impFindUnmatched(fixRow);
      if (!u || im2.fixBusy) return;
      im2.fix[fixRow] = im2.fix[fixRow] || {};
      if (fixAct === 'imp-add-open') { im2.fix[fixRow].addOpen = true; render(); return; }
      if (fixAct === 'imp-add-cancel') { im2.fix[fixRow].addOpen = false; render(); return; }
      if (fixAct === 'imp-merge') {
        var sel = appEl.querySelector('[data-fix-merge="' + fixRow + '"]');
        var aid = sel ? Number(sel.value) : 0;
        var pr = u.pairings.filter(function (x) { return x.assignmentId === aid; })[0];
        if (!pr) return;
        im2.fixBusy = true; render();
        impPost('/api/directory/client-aliases', { aliasText: u.client, assignmentId: aid })
          .then(function () { impAfterFix('“' + u.client + '” now matches ' + pr.client + (pr.program ? ' / ' + pr.program : '') + ' — for this and future imports. Check the preview, then Apply.'); })
          .catch(function (err) { im2.fixBusy = false; im2.error = err.message; render(); });
        return;
      }
      if (fixAct === 'imp-add') {
        var bIn = appEl.querySelector('[data-fix-billing="' + fixRow + '"]');
        var bVal = bIn ? bIn.value.trim() : '';
        im2.fix[fixRow].billing = bVal;
        if (bVal === '' || !isFinite(Number(bVal)) || Number(bVal) < 0) { im2.error = 'Enter the billing rate ($/hr) for the new pairing — invoices are billed at that rate.'; render(); return; }
        im2.fixBusy = true; render();
        impPost('/api/directory/consultants/' + u.consultantId + '/assignments/from-text', { clientText: u.client, billing: Number(bVal) })
          .then(function (b) {
            var a = b.assignment || {};
            im2.fix[fixRow].addOpen = false;
            impAfterFix((b.existed ? 'Pairing already existed: ' : 'Added pairing: ') + u.consultantName + ' on ' + (a.client_name || '') + (a.program_name ? ' / ' + a.program_name : '') +
              (a.billing !== null && a.billing !== undefined ? ' at $' + money(a.billing) + '/hr' : '') + '. Check the preview, then Apply.');
          })
          .catch(function (err) { im2.fixBusy = false; im2.error = err.message; render(); });
        return;
      }
    }
    var svAct = e.target.closest('[data-action="sv-toggle-payment"], [data-action="sv-toggle-timesheet"], [data-action="sv-delete"]');
    if (svAct) {
      var svId = Number(svAct.closest('[data-sv-id]').getAttribute('data-sv-id'));
      var svInv = state.sv.invoices.filter(function (i) { return i.kind === 'generated' && i.id === svId; })[0];
      if (!svInv) return;
      var act = svAct.getAttribute('data-action');
      if (act === 'sv-toggle-payment') patchSv(svId, { paymentStatus: svInv.payment_status === 'paid' ? 'unpaid' : 'paid' });
      else if (act === 'sv-toggle-timesheet') patchSv(svId, { timesheetSubmitted: svInv.timesheet_submitted === 'yes' ? 'no' : 'yes' });
      else {
        if (!confirm('Delete this invoice? This can\'t be undone.')) return;
        fetch('/api/subvendor-invoices/' + svId, { method: 'DELETE' }).then(function (res) {
          if (!res.ok) throw new Error('delete failed');
          state.sv.invoices = state.sv.invoices.filter(function (i) { return !(i.kind === 'generated' && i.id === svId); });
          render();
        }).catch(function () { alert('Could not delete that invoice. Please try again.'); });
      }
      return;
    }

    var tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) {
      state.tab = tabBtn.getAttribute('data-tab');
      if (state.tab === 'subvendor' && !state.sv.loaded) loadSubvendor();
      else if (state.tab === 'history') histLoad();
      else render();
      return;
    }

    var svGenBtn = e.target.closest('#svgenerate-btn');
    if (svGenBtn) {
      var sv = state.sv;
      sv.generateForm = {
        periodMonth: document.getElementById('svgen-period').value,
        netTerms: document.getElementById('svgen-net-terms').value,
        issueDate: document.getElementById('svgen-issue-date').value,
        includeInactive: document.getElementById('svgen-include-inactive').checked,
      };
      sv.generating = true;
      sv.generateResult = null;
      render();
      fetch('/api/subvendor-invoices/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sv.generateForm),
      }).then(function (res) {
        if (!res.ok) return res.json().then(function (b) { throw new Error(b.error || 'Generation failed'); });
        return res.json();
      }).then(function (body) {
        sv.generating = false;
        sv.generateResult = body;
        loadSubvendor();
      }).catch(function (err) {
        sv.generating = false;
        render();
        alert(err.message || 'Generation failed.');
      });
      return;
    }

    var genBtn = e.target.closest('#generate-btn');
    if (genBtn) {
      state.generateForm = {
        periodMonth: document.getElementById('gen-period').value,
        netTerms: document.getElementById('gen-net-terms').value,
        issueDate: document.getElementById('gen-issue-date').value,
        includeInactive: document.getElementById('gen-include-inactive').checked,
      };
      state.generating = true;
      state.generateResult = null;
      render();
      fetch('/api/invoices/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state.generateForm),
      }).then(function (res) {
        if (!res.ok) return res.json().then(function (b) { throw new Error(b.error || 'Generation failed'); });
        return res.json();
      }).then(function (body) {
        state.generating = false;
        state.generateResult = body;
        // Inactive consultants were just invoiced on purpose -- show them.
        if (state.generateForm.includeInactive) state.showInactive = true;
        // Show the invoice month that was just generated.
        // Keep "All months"; when specific months are picked, add the one just generated.
        var gm = state.generateForm.periodMonth || '';
        if (/^\d{4}-\d{2}$/.test(gm) && state.selectedMonths.length && state.selectedMonths.indexOf(gm) === -1) state.selectedMonths.push(gm);
        loadMonths();
        loadInvoices();
      }).catch(function (err) {
        state.generating = false;
        render();
        alert(err.message || 'Generation failed.');
      });
      return;
    }

    var toggleBtn = e.target.closest('[data-action="toggle-payment"], [data-action="toggle-timesheet"]');
    if (toggleBtn) {
      var row = toggleBtn.closest('[data-invoice-id]');
      var id = Number(row.getAttribute('data-invoice-id'));
      var inv = state.invoices.filter(function (i) { return i.id === id; })[0];
      if (!inv) return;
      if (toggleBtn.getAttribute('data-action') === 'toggle-payment') {
        patchInvoice(id, { paymentStatus: inv.payment_status === 'paid' ? 'unpaid' : 'paid' });
      } else {
        patchInvoice(id, { timesheetSubmitted: inv.timesheet_submitted === 'yes' ? 'no' : 'yes' });
      }
      return;
    }

    var delBtn = e.target.closest('[data-action="delete-invoice"]');
    if (delBtn) {
      var delRow = delBtn.closest('[data-invoice-id]');
      var delId = Number(delRow.getAttribute('data-invoice-id'));
      if (!confirm('Delete this invoice? This can\'t be undone.')) return;
      fetch('/api/invoices/' + delId, { method: 'DELETE' }).then(function (res) {
        if (!res.ok) throw new Error('delete failed');
        state.invoices = state.invoices.filter(function (i) { return i.id !== delId; });
        loadMonths();
        render();
      }).catch(function () {
        alert('Could not delete that invoice. Please try again.');
      });
    }
  });

  appEl.addEventListener('change', function (e) {
    var impFile = e.target.closest('#imp-file');
    if (impFile) {
      var f = impFile.files && impFile.files[0];
      if (!f) return;
      var imp = state.imp;
      imp.error = null; imp.notice = null; imp.fix = {}; imp.preview = null; imp.result = null; imp.busy = true; render();
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          var parsed = parseHoursWorkbook(XLSX.read(new Uint8Array(ev.target.result), { type: 'array' }));
          if (!parsed) throw new Error('Could not find a header row with a Name column, a Client column and “Hours/<month>” columns on any sheet.');
          imp.fileName = f.name; imp.parsed = parsed;
          imp.busy = false;
          impCall(false);
        } catch (err) { imp.busy = false; imp.fileName = null; imp.parsed = null; imp.error = err.message; render(); }
      };
      reader.onerror = function () { imp.busy = false; imp.error = 'Could not read the file.'; render(); };
      reader.readAsArrayBuffer(f);
      return;
    }
    var impSet = e.target.closest('#imp-year, #imp-net, #imp-pay, #imp-ts');
    if (impSet) {
      var im = state.imp;
      im.year = document.getElementById('imp-year').value; im.netTerms = document.getElementById('imp-net').value;
      im.paymentStatus = document.getElementById('imp-pay').value; im.timesheet = document.getElementById('imp-ts').value;
      if (im.parsed && !im.busy) impCall(false);
      return;
    }
    var svField = e.target.closest('[data-svfield]');
    if (svField) {
      var fid = Number(svField.closest('[data-sv-id]').getAttribute('data-sv-id'));
      var fpatch = {};
      fpatch[svField.getAttribute('data-svfield')] = svField.value === '' ? null : svField.value;
      patchSv(fid, fpatch);
      return;
    }
    var svPeriod = e.target.closest('#svfilter-period');
    if (svPeriod) { state.sv.periodFilter = svPeriod.value; loadSubvendor(); return; }
    var svSub = e.target.closest('#svfilter-subvendor');
    if (svSub) { state.sv.subvendorFilter = svSub.value; loadSubvendor(); return; }
    var svKind = e.target.closest('#svfilter-kind');
    if (svKind) { state.sv.kindFilter = svKind.value; loadSubvendor(); return; }
    var svInactive = e.target.closest('#svgen-include-inactive');
    if (svInactive) { state.sv.generateForm.includeInactive = svInactive.checked; return; }
    var svGenField = e.target.closest('#svgen-period, #svgen-net-terms, #svgen-issue-date');
    if (svGenField) {
      state.sv.generateForm.periodMonth = document.getElementById('svgen-period').value;
      state.sv.generateForm.netTerms = document.getElementById('svgen-net-terms').value;
      state.sv.generateForm.issueDate = document.getElementById('svgen-issue-date').value;
      return;
    }

    var monthBox = e.target.closest('[data-month], [data-month-all]');
    if (monthBox) {
      if (monthBox.hasAttribute('data-month-all')) state.selectedMonths = [];
      else {
        var mk = monthBox.getAttribute('data-month');
        var at = state.selectedMonths.indexOf(mk);
        if (monthBox.checked && at === -1) state.selectedMonths.push(mk);
        if (!monthBox.checked && at > -1) state.selectedMonths.splice(at, 1);
      }
      loadInvoices();
      return;
    }
    var filterPayment = e.target.closest('#filter-payment');
    if (filterPayment) { state.paymentFilter = filterPayment.value; loadInvoices(); return; }
    var filterTimesheet = e.target.closest('#filter-timesheet');
    if (filterTimesheet) { state.timesheetFilter = filterTimesheet.value; loadInvoices(); return; }
    var filterInactive = e.target.closest('#filter-show-inactive');
    if (filterInactive) { state.showInactive = filterInactive.checked; loadMonths(); loadInvoices(); return; }
    var genInactive = e.target.closest('#gen-include-inactive');
    if (genInactive) { state.generateForm.includeInactive = genInactive.checked; return; }
    var genField = e.target.closest('#gen-period, #gen-net-terms, #gen-issue-date');
    if (genField) {
      state.generateForm.periodMonth = document.getElementById('gen-period').value;
      state.generateForm.netTerms = document.getElementById('gen-net-terms').value;
      state.generateForm.issueDate = document.getElementById('gen-issue-date').value;
      return;
    }

    var field = e.target.closest('[data-field]');
    if (field) {
      var row = field.closest('[data-invoice-id]');
      var id = Number(row.getAttribute('data-invoice-id'));
      var fieldName = field.getAttribute('data-field');
      var value = field.value;
      var patch = {};
      patch[fieldName] = value === '' ? null : value;
      patchInvoice(id, patch);
    }
  });

  fetch('/api/auth/me').then(function (res) {
    if (res.status !== 200) { window.location.href = '/login.html'; return null; }
    return res.json();
  }).then(function (data) {
    if (!data) return;
    state.user = data.user;
    // Default view: every invoice month, grouped (the selector narrows it).
    loadMonths();
    loadInvoices();
  }).catch(function () {
    window.location.href = '/login.html';
  });
</script>
</body>
</html>
