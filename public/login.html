<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Mentour Suite</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0875E1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mentour">

<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-kicker">Mentour Suite</div>
    <h1 class="auth-title">Sign in.</h1>
    <p class="auth-copy">Ledger and Margin, in one place.</p>

    <form id="login-form">
      <label>Email
        <input type="email" name="email" required autocomplete="email">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <div id="step2" hidden>
        <p style="margin:0 0 10px;font-size:14px">Enter the 6-digit code from your authenticator app. Lost your phone? Enter one of your saved recovery codes instead.</p>
        <label>Code
          <input type="text" name="code" id="code" inputmode="text" autocomplete="one-time-code" maxlength="20" placeholder="123456">
        </label>
      </div>
      <div id="error" class="auth-error" hidden></div>
      <button type="submit" class="auth-btn">Sign in</button>
    </form>

    <div class="auth-footer">
      New here? <a href="/signup.html">Create an account</a>
    </div>
  </div>
</div>
<script>
  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var errorEl = document.getElementById('error');
    errorEl.hidden = true;
    var form = e.target;
    var step2 = document.getElementById('step2');
    var second = !step2.hidden;
    var body = second ? { code: form.code.value } : { email: form.email.value, password: form.password.value };
    var btn = form.querySelector('button');
    btn.disabled = true; btn.textContent = second ? 'Checking\u2026' : 'Signing in\u2026';
    try {
      var res = await fetch(second ? '/api/auth/2fa/verify' : '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      var data = await res.json();
      if (!res.ok) {
        if (data.expired) { step2.hidden = true; form.password.value = ''; form.email.closest('label').hidden = false; form.password.closest('label').hidden = false; }
        throw new Error(data.error || 'Something went wrong.');
      }
      if (data.needsTwoFactor) {
        form.email.closest('label').hidden = true; form.password.closest('label').hidden = true;
        step2.hidden = false; document.getElementById('code').focus();
        btn.disabled = false; btn.textContent = 'Verify';
        return;
      }
      window.location.href = data.passwordChangeRequired ? '/security.html?change=1' : ((data.user && data.user.role === 'recruiter') ? '/onboarding.html' : '/');
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
      btn.disabled = false; btn.textContent = step2.hidden ? 'Sign in' : 'Verify';
    }
  });
</script>
</body>
</html>
